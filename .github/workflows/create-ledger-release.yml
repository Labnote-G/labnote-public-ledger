# Install in Labnote-G/labnote-public-ledger/.github/workflows/create-ledger-release.yml.
# Supports legacy ledgers and versioned trusted evidence without replacing old assets.
name: Publish ledger release
on:
  push:
    branches: [main]
    tags: ["ledger-*", "evidence-v1-*", "tsa-supplement-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional ledger or evidence tag
        required: false
permissions:
  contents: write
concurrency:
  group: ledger-release-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tags=("$INPUT_TAG")
          elif [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tags=("$GITHUB_REF_NAME")
          else
            mapfile -t tags < <(git tag -l 'ledger-*' 'evidence-v1-*' 'tsa-supplement-*' --sort=creatordate)
          fi
          for tag in "${tags[@]}"; do
            notes=verification.md
            if [[ "$tag" =~ ^evidence-v1-([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
              rel="evidence-v1/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
              files=(manifest.json manifest.sha256 signature.sig labnote-public-key.pem summary.json verification.md)
            elif [[ "$tag" =~ ^ledger-([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
              rel="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}"
              files=(fingerprints.txt manifest.json verification.md)
              if git cat-file -e "$tag:$rel/timestamps.json" 2>/dev/null; then
                files+=(timestamps.json timestamp-verification.md)
                notes=timestamp-verification.md
              fi
            elif [[ "$tag" =~ ^tsa-supplement-([0-9]{4})-([0-9]{2})-([0-9]{2})-v([0-9]+)$ ]]; then
              rel="supplements/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}/tsa-v${BASH_REMATCH[4]}"
              if [[ "${BASH_REMATCH[4]}" -ge 3 ]]; then
                rel="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/${BASH_REMATCH[3]}/v${BASH_REMATCH[4]}"
              fi
              files=(fingerprints.txt manifest.json verification.md timestamps.json timestamp-verification.md)
            else
              echo "Unsupported tag" >&2
              exit 1
            fi
            if git cat-file -e "$tag:$rel/timestamp-files.zip" 2>/dev/null; then
              files+=(timestamp-files.zip)
            fi
            work=$(mktemp -d)
            assets=()
            for file in "${files[@]}"; do
              git show "$tag:$rel/$file" > "$work/$file"
              assets+=("$work/$file")
            done
            if gh release view "$tag" >/dev/null 2>&1; then
              mkdir "$work/existing"
              if [[ "$(gh release view "$tag" --json assets --jq '.assets | length')" -gt 0 ]]; then
                gh release download "$tag" --dir "$work/existing"
              fi
              for file in "${files[@]}"; do
                if [[ -f "$work/existing/$file" ]]; then
                  cmp "$work/$file" "$work/existing/$file" || { echo "Immutable release conflict: $tag/$file" >&2; exit 1; }
                else
                  gh release upload "$tag" "$work/$file"
                fi
              done
            else
              gh release create "$tag" "${assets[@]}" --title "Labnote $tag" --notes-file "$work/$notes" --latest=false
            fi
          done
